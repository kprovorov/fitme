name: Create Production Builds

on:
  push:
    tags:
      - "v*"

jobs:
  # build_android:
  #   type: build # This job type creates a production build for Android
  #   params:
  #     platform: android
  build_ios:
    type: build # This job type creates a production build for iOS
    params:
      platform: ios
  submit_ios:
    type: submit # This job type submits the production build for iOS to App Store Connect
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
