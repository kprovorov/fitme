name: Create Production Builds

on:
  push:
    tags:
      - "v*"

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
  submit_ios:
    name: Submit iOS Build
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
