name: Library API

# The API contract of apps/library. Lint, typecheck and tests run in Unit
# Tests through turbo, like every other app.
on:
  pull_request:
    paths:
      - apps/library/**
      # The muscle group enum in openapi.json is muscleGroups from @fitme/core.
      - packages/core/**
      - .github/oasdiff/**
      - .github/workflows/library-api.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The whole history, so the breaking-change check can compare
          # against the base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check openapi.json is up to date
        run: |
          pnpm --filter @fitme/library openapi
          if [ -n "$(git status --porcelain -- apps/library/openapi.json)" ]; then
            git diff -- apps/library/openapi.json
            echo "::error file=apps/library/openapi.json::openapi.json is stale: run pnpm library openapi and commit it"
            exit 1
          fi

      - name: Install oasdiff
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        env:
          OASDIFF_VERSION: 1.33.0
          OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247

      - name: Check for breaking API changes against the base branch
        run: .github/oasdiff/check-api-breaking.sh apps/library/openapi.json "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      # Generates the Library module from the fixture bundle (media
      # URLs on the placeholder Supabase project) and bundles the API.
      - name: Build the Library API
        run: pnpm --filter @fitme/library build

      # Vercel's Hono preset rejects an entrypoint without an exact "hono"
      # import (the regex from @vercel/hono's build).
      - name: Check the Vercel entrypoint imports hono
        run: grep -qE "(from|require|import)\s*(\(\s*)?[\"']hono[\"']" apps/library/dist/app.js
