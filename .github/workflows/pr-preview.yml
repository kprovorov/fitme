name: PR Preview

on:
  pull_request:
    types: [labeled]

jobs:
  pr-preview:
    if: github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Get Supabase preview branch credentials
        id: branch-details
        run: |
          BRANCH="${{ github.head_ref }}"
          DETAILS=$(supabase branches list --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --output json | jq '.[] | select(.name == "'"$BRANCH"'")')
          BRANCH_ID=$(echo "$DETAILS" | jq -r '.id')
          CREDS=$(supabase branches get "$BRANCH_ID" --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --output json)
          echo "api_url=$(echo $CREDS | jq -r '.SUPABASE_URL')" >> $GITHUB_OUTPUT
          echo "anon_key=$(echo $CREDS | jq -r '.SUPABASE_ANON_KEY')" >> $GITHUB_OUTPUT
          echo "branch_project_ref=$(echo $DETAILS | jq -r '.project_ref')" >> $GITHUB_OUTPUT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions to branch
        run: |
          supabase functions deploy preview-plan \
            --project-ref ${{ steps.branch-details.outputs.branch_project_ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build preview
        run: |
          eas build --platform ios \
            --profile preview \
            --non-interactive \
            --env "EXPO_PUBLIC_SUPABASE_URL=${{ steps.branch-details.outputs.api_url }}" \
            --env "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ steps.branch-details.outputs.anon_key }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
