# Classifies every non-draft PR to main as risk:low, risk:medium, risk:high or
# needs-human, with one sticky comment listing the reasons. It never merges.
#
# The gate is the label, not the check: the check is green for every verdict,
# risk:high and needs-human included, and turns red only when the workflow
# itself fails (it still tries to leave needs-human first). The repo is
# private on the free plan, which has no branch protection or rulesets, so the
# label is the only gate until the repo goes public.
#
# The deterministic rules (path floor, title rule, verdict validation) live in
# packages/pr-risk; this workflow only collects inputs and applies the result.
# The classifier runs from the base commit, so a PR cannot rewrite the rules
# that judge it by editing packages/pr-risk. This file itself runs from the PR
# (pull_request), so a PR that edits it can label itself: treat any PR touching
# .github/ as high risk regardless of its label. Revisit with
# pull_request_target when the repo goes public (it also gives fork PRs a
# token that can label).
name: PR Risk

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - converted_to_draft
      - labeled
      - unlabeled

# One run per PR; a new push cancels the running one. Label events other than
# no-auto-merge (including the verdict labels themselves) and edits that leave
# the title alone get their own group so they never cancel a classification.
concurrency:
  group: >-
    pr-risk-${{ github.event.pull_request.number }}${{
      (
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'no-auto-merge') ||
        (github.event.action == 'edited' && github.event.changes.title == null && github.event.changes.base == null)
      ) &&
      format('-{0}', github.run_id) || ''
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  classify:
    name: PR Risk
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-merge') &&
      (
        (github.event.action == 'edited' && (github.event.changes.title != null || github.event.changes.base != null)) ||
        (github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'no-auto-merge')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Set paths
        run: |
          {
            echo "CHANGED_FILES_PATH=$RUNNER_TEMP/changed-files.txt"
            echo "COMMENT_PATH=$RUNNER_TEMP/pr-risk-comment.md"
          } >> "$GITHUB_ENV"

      - name: Ensure labels exist
        run: |
          existing=$(gh label list --limit 1000 --json name --jq '.[].name')
          create() {
            if ! grep -qxF "$1" <<< "$existing"; then
              gh label create "$1" --color "$2" --description "$3"
            fi
          }
          create "risk:low" "0E8A16" "PR Risk: low risk, an agent may merge"
          create "risk:medium" "FBCA04" "PR Risk: medium risk, an agent may merge"
          create "risk:high" "B60205" "PR Risk: high risk, a human must merge"
          create "needs-human" "D93F0B" "PR Risk: a human must look before merging"
          create "no-auto-merge" "5319E7" "Skip PR Risk classification; a human merges"

      # Removing the old verdict first means a later failure never leaves a
      # stale label from an earlier head.
      - name: Remove previous verdict
        run: |
          current=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          for label in risk:low risk:medium risk:high needs-human; do
            if grep -qxF "$label" <<< "$current"; then
              gh pr edit "$PR_NUMBER" --remove-label "$label"
            fi
          done

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # Bootstrap only: until packages/pr-risk exists on main, the PR that
      # adds it runs its own copy.
      - name: Checkout PR (classifier not on base yet)
        if: hashFiles('packages/pr-risk/package.json') == ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the classifier
        run: pnpm install --frozen-lockfile --filter @fitme/pr-risk

      - name: List changed files
        # Renames list the old path too, so moving a file out of a floor path
        # still counts as touching it. The API lists at most 3000 files; a
        # longer list fails the run rather than classify a partial list.
        env:
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[]')
          jq -r '.filename, (.previous_filename // empty)' <<< "$files" > "$CHANGED_FILES_PATH"
          listed=$(jq -s 'length' <<< "$files")
          if [ "$listed" -lt "$EXPECTED_FILES" ]; then
            echo "::error::Listed $listed of $EXPECTED_FILES changed files"
            exit 1
          fi
          cat "$CHANGED_FILES_PATH"

      - name: Decide (path floor and title rule)
        id: decide
        run: pnpm --filter @fitme/pr-risk --silent decide

      # The evaluator (FIT-82) runs here when steps.decide.outputs.run_evaluator
      # is 'true', followed by a second decide call with its verdict or error.
      # Until then the first decision stands: needs-human, "evaluator not
      # configured yet".

      - name: Apply label
        env:
          LABEL: ${{ steps.decide.outputs.label }}
        run: gh pr edit "$PR_NUMBER" --add-label "$LABEL"

      - name: Update sticky comment
        run: |
          comment_ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-risk -->"))) | .id')
          comment_id=${comment_ids%%$'\n'*}
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
              -F "body=@$COMMENT_PATH" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_PATH"
          fi

      # The run is already red; this only tells a human why the PR carries
      # needs-human (or no verdict, if the GitHub API itself is failing).
      - name: Leave needs-human on failure
        if: failure()
        run: |
          {
            echo "<!-- pr-risk -->"
            echo "## PR Risk: \`needs-human\`"
            echo
            echo "**Source:** workflow error"
            echo
            echo "- The PR Risk workflow failed; see the [workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
          } > "$COMMENT_PATH"
          for label in risk:low risk:medium risk:high; do
            gh pr edit "$PR_NUMBER" --remove-label "$label" || true
          done
          gh pr edit "$PR_NUMBER" --add-label needs-human
          comment_ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-risk -->"))) | .id')
          comment_id=${comment_ids%%$'\n'*}
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
              -F "body=@$COMMENT_PATH" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_PATH"
          fi

  # A PR that goes back to draft or gets no-auto-merge loses its verdict, so
  # no stale risk label survives the opt-out.
  clear:
    name: PR Risk (clear verdict)
    if: >-
      github.event.action == 'converted_to_draft' ||
      (github.event.action == 'labeled' && github.event.label.name == 'no-auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove verdict labels
        run: |
          current=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          for label in risk:low risk:medium risk:high needs-human; do
            if grep -qxF "$label" <<< "$current"; then
              gh pr edit "$PR_NUMBER" --remove-label "$label"
            fi
          done

      - name: Mark sticky comment as skipped
        env:
          REASON: ${{ github.event.action == 'converted_to_draft' && 'the PR is a draft' || 'the PR is labelled no-auto-merge' }}
        run: |
          comment_ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-risk -->"))) | .id')
          comment_id=${comment_ids%%$'\n'*}
          if [ -n "$comment_id" ]; then
            body=$(printf '<!-- pr-risk -->\n## PR Risk: skipped\n\nNo verdict: %s.\n' "$REASON")
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
              -f "body=$body" > /dev/null
          fi
