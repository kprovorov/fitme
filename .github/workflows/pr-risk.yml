name: PR Risk

# Labels pull requests that change a Protected Path with `risk:high`
# (.github/labeler.yml, docs/agents/pr-risk.md).
#
# pull_request_target runs this workflow and its labeler config from `main`,
# and gives fork pull requests a token that can write labels. That is safe
# only because the job never checks out or runs pull request code: the
# labeler reads the changed file list through the API. Never add a checkout
# of the pull request head here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label Protected Path changes
        uses: actions/labeler@v7
        with:
          sync-labels: true
