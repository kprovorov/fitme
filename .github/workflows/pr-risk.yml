name: PR Risk

# Gives every pull request to main exactly one PR Risk label from the Risk
# Path list (.github/risk-paths.yml, docs/agents/pr-risk.md): `risk:high` when
# a changed file matches a high Risk Path, otherwise `risk:medium` when one
# matches a medium Risk Path, otherwise `risk:low`. The workflow owns those
# three labels and never touches any other.
#
# pull_request_target runs this workflow from `main`, and gives fork pull
# requests a token that can write labels. That is safe only because the job
# never checks out or runs pull request code: it reads the Risk Path list
# from the base commit and the changed file list through the API. Never add a
# checkout of the pull request head here.
on:
  pull_request_target:
    # edited: a pull request retargeted to main (other edits are skipped below)
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event.action != 'edited' || github.event.changes.base
    # Job level, so a skipped edit never cancels a running label job.
    concurrency:
      group: pr-risk-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Label by Risk Path
        uses: actions/github-script@v9
        with:
          script: |
            const { matchesGlob } = require("node:path");

            const RISK_PATHS = ".github/risk-paths.yml";
            const LABELS = { high: "risk:high", medium: "risk:medium", low: "risk:low" };
            // The pull request files API lists at most 3000 files.
            const MAX_LISTED_FILES = 3000;

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // The Risk Path list from the base commit, never the pull request
            // head, so a pull request can't relabel itself by editing it.
            const { data: riskPathsYaml } = await github.rest.repos.getContent({
              owner,
              repo,
              path: RISK_PATHS,
              ref: pr.base.sha,
              mediaType: { format: "raw" },
            });

            // A strict subset of YAML: `high:` and `medium:`, each a list of
            // `- glob` items (optionally double-quoted), comments and blank
            // lines. Anything else fails the job.
            const globs = { high: [], medium: [] };
            let tier;
            for (const [index, raw] of String(riskPathsYaml).split("\n").entries()) {
              const line = raw.replace(/\s+#.*$/, "").trimEnd();
              if (line.trim() === "" || line.trim().startsWith("#")) continue;
              const key = line.match(/^(high|medium):$/);
              const item = line.match(/^\s+-\s+(?:"([^"]+)"|([^"\s]+))$/);
              if (key) {
                tier = key[1];
              } else if (item && tier) {
                globs[tier].push(item[1] ?? item[2]);
              } else {
                throw new Error(`${RISK_PATHS}:${index + 1}: unexpected line: ${raw}`);
              }
            }
            if (globs.high.length === 0 || globs.medium.length === 0) {
              throw new Error(`${RISK_PATHS}: needs a non-empty high and medium list`);
            }

            // matchesGlob has no `dot` option, so `**` and `*` skip dot
            // segments. Also test path and glob with every segment's leading
            // dot swapped for a placeholder, so files in dot directories
            // inside a Risk Path match too (fails closed, to a higher tier).
            const undot = (value) => value.replace(/(^|\/)\./g, "$1\u0001");
            const matches = (file, glob) =>
              matchesGlob(file, glob) || matchesGlob(undot(file), undot(glob));

            let winner;
            if (pr.changed_files >= MAX_LISTED_FILES) {
              core.info(`${pr.changed_files} changed files: too many to list, high`);
              winner = "high";
            } else {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              // A renamed file counts under its previous name too.
              const paths = files.flatMap((file) =>
                file.previous_filename ? [file.filename, file.previous_filename] : [file.filename],
              );
              const hit = (list) => paths.find((file) => list.some((glob) => matches(file, glob)));
              const high = hit(globs.high);
              const medium = high === undefined ? hit(globs.medium) : undefined;
              if (high !== undefined) {
                core.info(`high: ${high}`);
                winner = "high";
              } else if (medium !== undefined) {
                core.info(`medium: ${medium}`);
                winner = "medium";
              } else {
                core.info(`low: none of ${paths.length} paths is a Risk Path`);
                winner = "low";
              }
            }

            // Current labels from the API, not the event payload, which can
            // be stale by the time this job runs.
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const names = new Set(current.map((label) => label.name));
            const label = LABELS[winner];
            if (!names.has(label)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [label],
              });
            }
            for (const other of Object.values(LABELS)) {
              if (other === label || !names.has(other)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: other,
                });
              } catch (error) {
                // Already gone (removed since it was listed) is fine.
                if (error.status !== 404) throw error;
              }
            }
            core.notice(`PR Risk: ${label}`);
