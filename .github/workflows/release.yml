name: Release

on:
  workflow_dispatch:

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Check current branch
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Default branch: ${{ github.event.repository.default_branch }}"

      - name: Detect bump type (major/minor/patch)
        id: bump
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            COMMIT_RANGE="all commits"
            COMMITS=$(git log --oneline)
          else
            COMMIT_RANGE="commits since $LATEST_TAG"
            COMMITS=$(git log --oneline ${LATEST_TAG}..HEAD)
          fi

          COMMIT_COUNT=$(echo "$COMMITS" | grep -v '^$' | wc -l)
          echo "Analyzing $COMMIT_COUNT $COMMIT_RANGE:"
          echo "$COMMITS"

          # Check for breaking changes first, then features, then defaults to patch
          if echo "$COMMITS" | grep -q "BREAKING CHANGE\|major:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -q "feat:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "type=${BUMP}" >> $GITHUB_OUTPUT
          echo "Detected bump type: ${BUMP}"

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Bump version in package.json
        id: bump-version
        run: |
          BUMP_TYPE="${{ steps.bump.outputs.type }}"
          echo "Bumping version with type: $BUMP_TYPE"

          # npm version will automatically calculate the new version
          npm version $BUMP_TYPE --no-git-tag-version

          # Get the new version that npm version created
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Bump version in app.json
        run: |
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"
          jq --arg version "$NEW_VERSION" '.expo.version = $version' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Verify version changes
        run: |
          echo "package.json version: $(node -p "require('./package.json').version")"
          echo "app.json version: $(jq -r '.expo.version' app.json)"

      - name: Commit and push version bump
        run: |
          git add package.json app.json
          git commit -m "chore: auto-bump version to ${{ steps.bump-version.outputs.new_version }} [skip ci]"
          git push origin ${{ github.event.repository.default_branch }}

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "Created and pushed tag v$NEW_VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"

          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" ${LATEST_TAG}~1..HEAD)
          fi

          # Build changelog sections
          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r msg; do
            # Skip version bump commits and empty lines
            if echo "$msg" | grep -q "^\[skip ci\]\|auto-bump version\|^$"; then
              continue
            fi

            if echo "$msg" | grep -q "BREAKING CHANGE\|major:"; then
              BREAKING="$BREAKING"$'\n'"- $msg"
            elif echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
              FEATURES="$FEATURES"$'\n'"- $msg"
            elif echo "$msg" | grep -qE "^fix(\(.+\))?:"; then
              FIXES="$FIXES"$'\n'"- $msg"
            else
              OTHER="$OTHER"$'\n'"- $msg"
            fi
          done <<< "$COMMITS"

          # Assemble changelog
          CHANGELOG="## What's Changed"

          if [ -n "$BREAKING" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### Breaking Changes"$'\n'"$BREAKING"
          fi
          if [ -n "$FEATURES" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### New Features"$'\n'"$FEATURES"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### Bug Fixes"$'\n'"$FIXES"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### Other Changes"$'\n'"$OTHER"
          fi

          if [ "$CHANGELOG" = "## What's Changed" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"No notable changes."
          fi

          # Write to file to safely pass multiline content
          echo "$CHANGELOG" > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"
          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --notes-file /tmp/changelog.md
