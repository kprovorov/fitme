name: Release

# The release tag is the app version: this workflow never commits to main.
# The build job stamps the tag's version into app.json at build time.

on:
  workflow_dispatch:

jobs:
  # unit-tests:
  #   uses: ./.github/workflows/unit-tests.yml

  # e2e:
  #   needs: unit-tests
  #   uses: ./.github/workflows/e2e.yml
  #   secrets: inherit

  release:
    # needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: v${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bump type (major/minor/patch)
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          echo "previous_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --format='%s%n%b')
          else
            if [ -z "$(git rev-list ${LATEST_TAG}..HEAD)" ]; then
              echo "::error::No commits since ${LATEST_TAG}, nothing to release."
              exit 1
            fi
            COMMITS=$(git log --format='%s%n%b' ${LATEST_TAG}..HEAD)
          fi

          echo "Commits since ${LATEST_TAG:-the beginning}:"
          echo "$COMMITS"

          # Breaking changes first, then features, then default to patch
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^[a-z]+(\(.+\))?!:|^major:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "type=${BUMP}" >> $GITHUB_OUTPUT
          echo "Detected bump type: ${BUMP}"

      - name: Compute new version
        id: version
        run: |
          PREVIOUS="${{ steps.bump.outputs.previous_tag }}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate changelog
        run: |
          PREVIOUS="${{ steps.bump.outputs.previous_tag }}"

          if [ -z "$PREVIOUS" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" ${PREVIOUS}..HEAD)
          fi

          # Build changelog sections
          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r msg; do
            # Skip legacy version bump commits and empty lines
            if echo "$msg" | grep -q "^\[skip ci\]\|auto-bump version\|^$"; then
              continue
            fi

            if echo "$msg" | grep -qE "BREAKING CHANGE|^[a-z]+(\(.+\))?!:|^major:"; then
              BREAKING="$BREAKING"$'\n'"- $msg"
            elif echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
              FEATURES="$FEATURES"$'\n'"- $msg"
            elif echo "$msg" | grep -qE "^fix(\(.+\))?:"; then
              FIXES="$FIXES"$'\n'"- $msg"
            else
              OTHER="$OTHER"$'\n'"- $msg"
            fi
          done <<< "$COMMITS"

          # Assemble changelog
          CHANGELOG="## What's Changed"

          if [ -n "$BREAKING" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### Breaking Changes"$'\n'"$BREAKING"
          fi
          if [ -n "$FEATURES" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### New Features"$'\n'"$FEATURES"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### Bug Fixes"$'\n'"$FIXES"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"### Other Changes"$'\n'"$OTHER"
          fi

          if [ "$CHANGELOG" = "## What's Changed" ]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"No notable changes."
          fi

          # Write to file to safely pass multiline content
          echo "$CHANGELOG" > /tmp/changelog.md
          cat /tmp/changelog.md

      # Creating the release also creates the tag on the commit this run
      # checked out. Tags aren't covered by the main branch ruleset.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          gh release create "v$NEW_VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$NEW_VERSION" \
            --notes-file /tmp/changelog.md

      # Continuous Linear pipeline: records the shipped release with every
      # issue referenced by commits since the previous release tag.
      - name: Create Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: v${{ steps.version.outputs.new_version }}
          base_ref: ${{ steps.bump.outputs.previous_tag }}
          links: |
            GitHub release=${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.new_version }}

  # A tag pushed with GITHUB_TOKEN doesn't trigger other workflows, so the
  # build runs from here instead of on `push: tags`.
  build:
    needs: release
    uses: ./.github/workflows/build-mobile.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
