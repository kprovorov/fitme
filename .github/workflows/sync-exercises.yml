name: Sync Exercises

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/supabase/data/exercises.csv"
      - "packages/supabase/data/descriptions/**"
      - "packages/supabase/data/instructions/**"
      - "packages/supabase/supabase/sync.ts"

jobs:
  sync-exercises:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync exercises to production
        run: pnpm --filter @fitme/supabase exercises:sync
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
