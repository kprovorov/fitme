name: Integration Tests

on:
  workflow_call:
  pull_request:

jobs:
  mcp:
    name: MCP server (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Uses the Supabase CLI pinned in @fitme/supabase's devDependencies.
      # Only Postgres, PostgREST (API gateway), Auth and the Supavisor pooler
      # (transaction mode, for packages/db) are needed.
      - name: Start Supabase
        working-directory: packages/supabase
        run: pnpm exec supabase start --exclude studio,realtime,storage,functions,mail,analytics

      - name: Export Supabase credentials
        working-directory: packages/supabase
        run: |
          pnpm exec supabase status --env --output-format text > "$RUNNER_TEMP/supabase.env"
          set -a && . "$RUNNER_TEMP/supabase.env" && set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Run database tests (pgTAP)
        working-directory: packages/supabase
        run: pnpm exec supabase test db

      # The hoisted install skips snaplet's postinstall; build the client
      # from the committed .snaplet/dataModel.json.
      - name: Generate seed client
        run: pnpm --filter @fitme/supabase exec snaplet-seed generate

      - name: Seed exercise library
        run: pnpm --filter @fitme/supabase seed

      # Proves the local stack trusts Clerk development session tokens
      # ([auth.third_party.clerk] in config.toml). Needs the development
      # instance's secret key; skipped with a warning when it is not set.
      - name: Check Clerk third-party trust
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::warning::CLERK_DEV_SECRET_KEY is not set; skipping the Clerk trust check"
            exit 0
          fi
          pnpm --filter @fitme/supabase clerk:check

      # Runs the Supabase Auth -> Clerk migration script (dry run, run, rerun)
      # against freshly signed-up users and deletes the Clerk Users it made.
      # Must run before the MCP tests: it migrates every user in auth.users.
      - name: Check Clerk User migration
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::warning::CLERK_DEV_SECRET_KEY is not set; skipping the Clerk User migration check"
            exit 0
          fi
          pnpm --filter @fitme/supabase clerk:check-migration

      # asUser / withService through the local Supavisor pooler as the fitme
      # login; vitest.integration.config.ts has the local connection string
      # (development password from supabase/roles.sql).
      - name: Run packages/db integration tests
        run: pnpm --filter @fitme/db test:integration

      # The Clerk OAuth suite (integration/clerk-oauth.test.ts) runs a real
      # headless OAuth flow against the Clerk development instance and is
      # skipped when CLERK_DEV_SECRET_KEY is not set.
      - name: Run MCP integration tests
        env:
          CLERK_DEV_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
        run: pnpm --filter @fitme/mcp test:integration

      - name: Stop Supabase
        if: always()
        working-directory: packages/supabase
        run: pnpm exec supabase stop
