name: Unit Tests

on:
  workflow_call:
  pull_request:

# A new push cancels the pull request's run still in progress. Any other run
# (workflow_call) gets a group of its own, so it's never cancelled or queued.
concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A test that keeps Jest or vitest alive (an open handle) fails here
      # with this step named, instead of hanging until the job limit.
      - name: Run unit tests
        timeout-minutes: 10
        run: pnpm turbo run test

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format (ultracite)
        run: pnpm check

      - name: No color literals or arbitrary sizes (design tokens)
        run: pnpm literal-check

      # `expo start` writes this (gitignored) file on every developer machine,
      # and expo/types widens ViewStyle with web props: typecheck that state.
      - name: Write the expo-env.d.ts Metro generates
        run: printf '/// <reference types="expo/types" />\n' > apps/mobile/expo-env.d.ts

      - name: Typecheck
        run: pnpm typecheck

      # Expo publishes SDK patches the app doesn't pick up by itself (FIT-135,
      # FIT-332): show the drift on every pull request without blocking it.
      - name: Expo packages on the SDK's current patches (non-blocking)
        continue-on-error: true
        run: |
          if ! pnpm --filter @fitme/mobile exec expo install --check; then
            echo "::warning title=Expo patch drift::Expo packages are behind the SDK's current patches: run pnpm --filter @fitme/mobile exec expo install --check"
            exit 1
          fi

  # The backstop for the pre-commit scan (.husky/pre-commit), which a machine
  # without gitleaks skips: every commit the pull request adds, with
  # .gitleaks.toml's rules and allowlist.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the pull request's commits
        env:
          BASE_REF: ${{ github.base_ref }}
        # git log shows no patch for a merge commit by default, so a secret
        # added while resolving a merge would go unseen without --diff-merges.
        run: gitleaks git --log-opts="--diff-merges=first-parent origin/${BASE_REF}..HEAD" --redact --no-banner .
