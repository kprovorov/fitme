name: Unit Tests

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm turbo run test

  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format (ultracite)
        run: pnpm check

      - name: No color literals or arbitrary sizes (design tokens)
        run: pnpm literal-check

      # `expo start` writes this (gitignored) file on every developer machine,
      # and expo/types widens ViewStyle with web props: typecheck that state.
      - name: Write the expo-env.d.ts Metro generates
        run: printf '/// <reference types="expo/types" />\n' > apps/mobile/expo-env.d.ts

      - name: Typecheck
        run: pnpm typecheck

      # The worktree scripts (scripts/*.sh, T3's setup and settle among them)
      # and the Node they call. shellcheck comes with the runner image.
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Shell scripts' Node helpers (node:test)
        run: pnpm test:scripts

  # scripts/setup.sh runs under the bash 3.2 macOS ships as /bin/bash, which
  # parses some things bash 5 accepts as syntax errors (a quote inside a heredoc
  # in `$(...)` broke every worktree's setup once), so parse every script with
  # that bash. Linux's bash 5 can't catch it.
  shell-macos:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Parse the scripts with /bin/bash
        run: |
          /bin/bash --version | head -1
          status=0
          for script in scripts/*.sh; do
            /bin/bash -n "$script" || status=1
          done
          exit "$status"

  # The backstop for the pre-commit scan (.husky/pre-commit), which a machine
  # without gitleaks skips: every commit the pull request adds, with
  # .gitleaks.toml's rules and allowlist.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the pull request's commits
        env:
          BASE_REF: ${{ github.base_ref }}
        # git log shows no patch for a merge commit by default, so a secret
        # added while resolving a merge would go unseen without --diff-merges.
        run: gitleaks git --log-opts="--diff-merges=first-parent origin/${BASE_REF}..HEAD" --redact --no-banner .
