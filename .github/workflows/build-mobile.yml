name: Build Mobile

# Production EAS build for a release tag. The tag is the app version: it is
# stamped into app.json here (never committed) and EAS uploads the working
# tree, so the build carries it. Runs after Release, or by hand to rebuild.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.23.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.23.0
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    # eas build --no-wait only queues the build, so the job is short.
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Stamp version from tag
        working-directory: apps/mobile
        env:
          TAG: ${{ inputs.tag }}
        run: |
          jq --arg version "${TAG#v}" '.expo.version = $version' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "app.json version: $(jq -r '.expo.version' app.json)"

      - name: Start EAS build and submit
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
