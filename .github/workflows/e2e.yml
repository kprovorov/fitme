name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    # macOS 26 for its default Xcode (26.x): the Expo SDK's expo-modules-jsi
    # builds with Swift tools 6.2, which macOS 15's default Xcode 16.4 lacks.
    runs-on: macos-26
    # The Release build alone takes about 30 minutes and the flows about 20.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every supabase call uses the CLI pinned in the lockfile (the
      # @fitme/supabase devDependency), like the other workflows.
      - name: Create Supabase preview branch
        id: branch
        run: |
          BRANCH="e2e-${{ github.run_id }}"
          pnpm exec supabase branches create "$BRANCH" --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Wait for branch to be ready
        id: branch-status
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          for i in $(seq 1 36); do
            DETAILS=$(pnpm exec supabase branches list --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --output json 2>/dev/null | jq '.[] | select(.name == "'"$BRANCH"'")' || echo '{}')
            PREVIEW_STATUS=$(echo "$DETAILS" | jq -r '.preview_project_status // empty')
            DEPLOY_STATUS=$(echo "$DETAILS" | jq -r '.status // empty')
            if [ "$PREVIEW_STATUS" = "ACTIVE_HEALTHY" ] && [ "$DEPLOY_STATUS" = "FUNCTIONS_DEPLOYED" ]; then
              echo "Branch is ready"
              echo "branch_id=$(echo $DETAILS | jq -r '.id')" >> $GITHUB_OUTPUT
              echo "branch_project_ref=$(echo $DETAILS | jq -r '.project_ref')" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Branch status: ${PREVIEW_STATUS:-pending}/${DEPLOY_STATUS:-pending} (attempt $i/36)"
            sleep 10
          done
          echo "Branch never became ready after 6 minutes" && exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The repo is public, so its logs are too: mask the anon key and the
      # Postgres URL (it carries the password) before anything can print them.
      # A step output isn't masked by itself, and a masked value stays masked
      # in every later step that reads the output. The session-pooler variant
      # db push uses (5432 instead of 6543) and the password alone are masked
      # as well.
      - name: Get branch credentials
        id: branch-details
        run: |
          CREDS=$(pnpm exec supabase branches get "${{ steps.branch-status.outputs.branch_id }}" --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --output json)
          ANON_KEY=$(jq -r '.SUPABASE_ANON_KEY' <<< "$CREDS")
          POSTGRES_URL=$(jq -r '.POSTGRES_URL' <<< "$CREDS")
          for VALUE in "$ANON_KEY" "$POSTGRES_URL"; do
            if [ -z "$VALUE" ] || [ "$VALUE" = null ]; then
              echo "::error::supabase branches get returned no anon key or Postgres URL" && exit 1
            fi
          done
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$POSTGRES_URL"
          echo "::add-mask::${POSTGRES_URL/:6543\//:5432/}"
          DB_PASSWORD=${POSTGRES_URL#*://*:}
          DB_PASSWORD=${DB_PASSWORD%%@*}
          echo "::add-mask::$DB_PASSWORD"
          echo "api_url=$(jq -r '.SUPABASE_URL' <<< "$CREDS")" >> "$GITHUB_OUTPUT"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "postgres_url=$POSTGRES_URL" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # A CLI-created branch clones production's auth config, which trusts only
      # the production Clerk instance. Add the development instance (the
      # domain in config.toml's [auth.third_party.clerk]) so the E2E build's
      # development session tokens are accepted.
      - name: Trust Clerk development instance on branch
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/${{ steps.branch-status.outputs.branch_project_ref }}/config/auth/third-party-auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"oidc_issuer_url":"https://fitting-rattler-3649.clerk.accounts.dev"}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # A CLI-created branch starts without the repo's migrations. The
      # session pooler (5432) is used because db push needs prepared statements.
      - name: Apply migrations to branch
        working-directory: packages/supabase
        run: pnpm exec supabase db push --db-url "${DATABASE_URL/:6543\//:5432/}"
        env:
          DATABASE_URL: ${{ steps.branch-details.outputs.postgres_url }}

      # The Public API (apps/api) runs on this runner against the branch, as
      # the fitme login through the branch's transaction pooler. The login has
      # no password on a new branch: it gets one generated for this run, which
      # is masked before anything can print it and dies with the branch.
      - name: Set the fitme login's password on branch
        id: fitme
        run: |
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          # postgresql://postgres.<tenant>:<password>@<host>:6543/postgres
          USERINFO=${POSTGRES_URL#*://}
          USERINFO=${USERINFO%%@*}
          DB_USER=${USERINFO%%:*}
          TENANT=${DB_USER#postgres.}
          if [ "$TENANT" = "$DB_USER" ] || [ -z "$TENANT" ]; then
            echo "::error::The branch's Postgres URL is not a pooler URL (postgres.<tenant>)" && exit 1
          fi
          # Host, port, database and any query string the branch's URL carries.
          LOCATION=${POSTGRES_URL#*@}
          case "$LOCATION" in *\?*) SEPARATOR="&" ;; *) SEPARATOR="?" ;; esac
          DATABASE_URL="postgresql://fitme.$TENANT:$PASSWORD@$LOCATION${SEPARATOR}application_name=api"
          echo "::add-mask::$DATABASE_URL"
          # Hex only, so the literal needs no escaping.
          jq -n --arg query "alter role fitme with password '$PASSWORD'" '{ query: $query }' |
            curl --fail-with-body -sS -X POST \
              "https://api.supabase.com/v1/projects/${{ steps.branch-status.outputs.branch_project_ref }}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
        env:
          POSTGRES_URL: ${{ steps.branch-details.outputs.postgres_url }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The E2E Users are on the Clerk development instance, so the API
      # verifies its tokens (the instance's public key, no secret). No Upstash
      # (and no NODE_ENV=production): the in-memory rate limiter. No
      # LIBRARY_URL / LIBRARY_PUBLIC_API_SECRET: no flow saves a Plan, so no
      # production secret goes into GitHub; a flow that does needs its own
      # decision. The app's minimum version gate and every write go here.
      - name: Start the Public API
        run: |
          CLERK_JWT_KEY=$(pnpm --silent db clerk:jwt-key)
          export CLERK_JWT_KEY
          pnpm --filter @fitme/api build
          nohup node apps/api/dist/node/index.js > apps/api/e2e-api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS "$API_URL/health" > /dev/null 2>&1; then
              echo "The API answers at $API_URL"
              exit 0
            fi
            if ! kill -0 "$API_PID" 2> /dev/null; then
              echo "::error::The API exited before answering /health" && cat apps/api/e2e-api.log && exit 1
            fi
            sleep 2
          done
          echo "::error::The API never answered /health" && cat apps/api/e2e-api.log && exit 1
        env:
          PORT: "3003"
          API_URL: http://localhost:3003
          FITME_DATABASE_URL: ${{ steps.fitme.outputs.database_url }}

      # A session token of a throwaway +clerk_test User is accepted by the
      # branch's Data API and by the Public API, which reads the branch's data
      # as that User (GET /v1/profile).
      - name: Check Clerk session tokens on branch and API
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
          SUPABASE_URL: ${{ steps.branch-details.outputs.api_url }}
          SUPABASE_ANON_KEY: ${{ steps.branch-details.outputs.anon_key }}
          API_URL: http://localhost:3003
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::CLERK_DEV_SECRET_KEY is not set" && exit 1
          fi
          pnpm --filter @fitme/supabase clerk:check

      # Pinned: the installer takes the latest release otherwise, and 2.12.0's
      # iOS driver timed out starting on this runner where 2.11.0's started.
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        env:
          MAESTRO_VERSION: "2.11.0"

      - name: Generate native iOS project
        run: pnpm --filter @fitme/mobile exec expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_E2E_ENABLED: "true"
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.branch-details.outputs.api_url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.branch-details.outputs.anon_key }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_DEV_PUBLISHABLE_KEY }}
          # Production's Library API, which accepts development-instance
          # Clerk tokens, so E2E needs no deployment of its own.
          EXPO_PUBLIC_LIBRARY_URL: https://library.fitmeproject.com
          # The Public API started above (the simulator shares the runner's
          # loopback).
          EXPO_PUBLIC_API_URL: http://localhost:3003
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: "placeholder"
          EXPO_PUBLIC_SENTRY_DSN: ""

      - name: Install CocoaPods
        run: pod install
        working-directory: apps/mobile/ios

      - name: Build iOS simulator app
        working-directory: apps/mobile
        # pipefail: xcpretty would otherwise hide a failed build. xcpretty
        # also drops script phases' output, so the raw log is kept and
        # uploaded with the results.
        # Signed ad hoc, never unsigned: an unsigned app has no
        # application-identifier entitlement, so the keychain refuses it, Clerk's
        # token cache (expo-secure-store) never answers and the app never gets
        # past its loading spinner.
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY=- \
            SENTRY_DISABLE_AUTO_UPLOAD=true | tee xcodebuild.log | xcpretty
        env:
          EXPO_PUBLIC_E2E_ENABLED: "true"
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.branch-details.outputs.api_url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.branch-details.outputs.anon_key }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_DEV_PUBLISHABLE_KEY }}
          # Production's Library API, which accepts development-instance
          # Clerk tokens, so E2E needs no deployment of its own.
          EXPO_PUBLIC_LIBRARY_URL: https://library.fitmeproject.com
          # The Public API started above (the simulator shares the runner's
          # loopback).
          EXPO_PUBLIC_API_URL: http://localhost:3003
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: "placeholder"
          EXPO_PUBLIC_SENTRY_DSN: ""

      - name: Boot simulator and install app
        working-directory: apps/mobile
        run: |
          # iPhone 17 (the iOS 26 runtimes have no iPhone 16), else any iPhone.
          DEVICES=$(xcrun simctl list devices available -j)
          UDID=$(jq -r '.devices | to_entries[] | .value[] | select(.name == "iPhone 17") | .udid' <<< "$DEVICES" | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(jq -r '.devices | to_entries[] | .value[] | select(.name | startswith("iPhone")) | .udid' <<< "$DEVICES" | head -1)
          fi
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available" && exit 1
          fi
          xcrun simctl boot "$UDID"
          # boot returns before the simulator is up; wait until it is.
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find ios/build -name "*.app" -maxdepth 6 | head -1)
          xcrun simctl install "$UDID" "$APP"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

      # Each flow registers its own +clerk_test User on the Clerk development
      # instance (test mode: no email sent, fixed code 424242).
      - name: Run E2E tests
        working-directory: apps/mobile
        # No `--`: pnpm forwards it, and Maestro would read the options after
        # it as flow paths.
        run: pnpm test:e2e --format junit --output e2e-results.xml
        env:
          # Maestro builds and starts its XCTest driver first, which takes
          # close to its 2-minute default on this runner (ms).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"

      # Artifacts aren't masked: a log holding the fitme password is never
      # uploaded. The API gets no other secret, so it is the only one to look
      # for; a secret added to the API's env belongs in this check too.
      - name: Check the API log holds no password
        if: always()
        run: |
          if [ -f apps/api/e2e-api.log ] && [ -n "$PASSWORD" ] && grep -qF "$PASSWORD" apps/api/e2e-api.log; then
            echo "::error::The API log holds the fitme password; not uploading it"
            rm apps/api/e2e-api.log
            exit 1
          fi
        env:
          PASSWORD: ${{ steps.fitme.outputs.password }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            apps/mobile/e2e-results.xml
            apps/mobile/xcodebuild.log
            apps/api/e2e-api.log

      - name: Delete Supabase preview branch
        if: always()
        run: pnpm exec supabase branches delete ${{ steps.branch-status.outputs.branch_id }} --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
