name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every supabase call uses the CLI pinned in the lockfile (the
      # @fitme/supabase devDependency), like the other workflows.
      - name: Create Supabase preview branch
        id: branch
        run: |
          BRANCH="e2e-${{ github.run_id }}"
          pnpm exec supabase branches create "$BRANCH" --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Wait for branch to be ready
        id: branch-status
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          for i in $(seq 1 36); do
            DETAILS=$(pnpm exec supabase branches list --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --output json 2>/dev/null | jq '.[] | select(.name == "'"$BRANCH"'")' || echo '{}')
            PREVIEW_STATUS=$(echo "$DETAILS" | jq -r '.preview_project_status // empty')
            DEPLOY_STATUS=$(echo "$DETAILS" | jq -r '.status // empty')
            if [ "$PREVIEW_STATUS" = "ACTIVE_HEALTHY" ] && [ "$DEPLOY_STATUS" = "FUNCTIONS_DEPLOYED" ]; then
              echo "Branch is ready"
              echo "branch_id=$(echo $DETAILS | jq -r '.id')" >> $GITHUB_OUTPUT
              echo "branch_project_ref=$(echo $DETAILS | jq -r '.project_ref')" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Branch status: ${PREVIEW_STATUS:-pending}/${DEPLOY_STATUS:-pending} (attempt $i/36)"
            sleep 10
          done
          echo "Branch never became ready after 6 minutes" && exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Get branch credentials
        id: branch-details
        run: |
          CREDS=$(pnpm exec supabase branches get "${{ steps.branch-status.outputs.branch_id }}" --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --output json)
          echo "api_url=$(echo $CREDS | jq -r '.SUPABASE_URL')" >> $GITHUB_OUTPUT
          echo "anon_key=$(echo $CREDS | jq -r '.SUPABASE_ANON_KEY')" >> $GITHUB_OUTPUT
          echo "service_key=$(echo $CREDS | jq -r '.SUPABASE_SERVICE_ROLE_KEY')" >> $GITHUB_OUTPUT
          echo "postgres_url=$(echo $CREDS | jq -r '.POSTGRES_URL')" >> $GITHUB_OUTPUT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # A CLI-created branch clones production's auth config, which trusts only
      # the production Clerk instance. Add the development instance (the
      # domain in config.toml's [auth.third_party.clerk]) so the E2E build's
      # development session tokens are accepted.
      - name: Trust Clerk development instance on branch
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/${{ steps.branch-status.outputs.branch_project_ref }}/config/auth/third-party-auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"oidc_issuer_url":"https://fitting-rattler-3649.clerk.accounts.dev"}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Skipped with a warning when the development instance's secret key is
      # not set.
      - name: Check Clerk third-party trust
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
          SUPABASE_URL: ${{ steps.branch-details.outputs.api_url }}
          SUPABASE_ANON_KEY: ${{ steps.branch-details.outputs.anon_key }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::warning::CLERK_DEV_SECRET_KEY is not set; skipping the Clerk trust check"
            exit 0
          fi
          pnpm --filter @fitme/supabase clerk:check

      # A CLI-created branch starts without the repo's migrations. The
      # session pooler (5432) is used because db push needs prepared statements.
      - name: Apply migrations to branch
        working-directory: packages/supabase
        run: pnpm exec supabase db push --db-url "${DATABASE_URL/:6543\//:5432/}"
        env:
          DATABASE_URL: ${{ steps.branch-details.outputs.postgres_url }}

      # The hoisted install skips snaplet's postinstall; build the client
      # from the committed .snaplet/dataModel.json.
      - name: Generate seed client
        run: pnpm --filter @fitme/supabase exec snaplet-seed generate

      - name: Seed database
        run: pnpm --filter @fitme/supabase seed
        env:
          DATABASE_URL: ${{ steps.branch-details.outputs.postgres_url }}

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Generate native iOS project
        run: pnpm --filter @fitme/mobile exec expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_E2E_ENABLED: "true"
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.branch-details.outputs.api_url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.branch-details.outputs.anon_key }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_DEV_PUBLISHABLE_KEY }}
          # Production's Exercise Library, which accepts development-instance
          # Clerk tokens, so E2E needs no deployment of its own.
          EXPO_PUBLIC_EXERCISES_URL: https://exercises.fitmeproject.com
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: "placeholder"
          EXPO_PUBLIC_SENTRY_DSN: ""

      - name: Install CocoaPods
        run: pod install
        working-directory: apps/mobile/ios

      - name: Build iOS simulator app
        working-directory: apps/mobile
        # pipefail: xcpretty would otherwise hide a failed build.
        # Signed ad hoc, never unsigned: an unsigned app has no
        # application-identifier entitlement, so the keychain refuses it, Clerk's
        # token cache (expo-secure-store) never answers and the app never gets
        # past its loading spinner.
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY=- \
            SENTRY_DISABLE_AUTO_UPLOAD=true | xcpretty
        env:
          EXPO_PUBLIC_E2E_ENABLED: "true"
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.branch-details.outputs.api_url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.branch-details.outputs.anon_key }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_DEV_PUBLISHABLE_KEY }}
          # Production's Exercise Library, which accepts development-instance
          # Clerk tokens, so E2E needs no deployment of its own.
          EXPO_PUBLIC_EXERCISES_URL: https://exercises.fitmeproject.com
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: "placeholder"
          EXPO_PUBLIC_SENTRY_DSN: ""

      - name: Boot simulator and install app
        working-directory: apps/mobile
        run: |
          UDID=$(xcrun simctl list devices available -j | \
            jq -r '.devices | to_entries[] | .value[] | select(.name == "iPhone 16") | .udid' | head -1)
          xcrun simctl boot "$UDID"
          APP=$(find ios/build -name "*.app" -maxdepth 6 | head -1)
          xcrun simctl install "$UDID" "$APP"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

      # Each flow registers its own +clerk_test User on the Clerk development
      # instance (test mode: no email sent, fixed code 424242).
      - name: Run E2E tests
        working-directory: apps/mobile
        run: pnpm test:e2e -- --format junit --output e2e-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: apps/mobile/e2e-results.xml

      - name: Delete Supabase preview branch
        if: always()
        run: pnpm exec supabase branches delete ${{ steps.branch-status.outputs.branch_id }} --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
