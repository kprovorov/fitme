packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo autolinking and Metro expect a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@sentry/cli"
  - "@snaplet/seed"
  - esbuild
  - sharp
  - supabase

ignoredBuiltDependencies:
  - "@mongodb-js/zstd"
  - browser-tabs-lock
  - core-js
  - node-liblzma

minimumReleaseAgeExclude:
  - lucide-react@1.47.0
  - '@modelcontextprotocol/sdk@1.30.1'
  - hono@4.13.9
