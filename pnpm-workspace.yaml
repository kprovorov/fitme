packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo autolinking and Metro expect a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# One react for the whole workspace: the version React Native in Expo SDK 58
# expects. Without this, auto-installed peers (Clerk, Next in the backend apps)
# resolve the newest react and leave a second copy for expo-doctor to flag.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  # One zod 4 for the workspace: @vercel/cli-config (under @vercel/functions)
  # and ultracite pin other 4.x versions exactly. Keep them on the apps' zod
  # version.
  "@vercel/cli-config>zod": 4.6.7
  "ultracite>zod": 4.6.7
  # zod-to-json-schema (under MCP's @modelcontextprotocol/sdk) takes zod as a
  # peer, which resolved to zod 3: open to GHSA-mrhx-c7xc-m3w5, with no fixed
  # 3.x (FIT-330). Keep it on the apps' zod 4; it reads schemas through
  # `zod/v3`, which zod 4 still ships. A parent that brings its own zod 3
  # (mobile's expo-mcp, @expo/cli) still resolves zod 3: that stays until Expo
  # moves to zod 4. Drop the line once the SDK no longer depends on it.
  "zod-to-json-schema>zod": 4.6.7
  # Arnold's undici (FIT-328): guarded-fetch (under just-bash) pins undici
  # 7.29.0 / 7.30.0, open to the GHSA-xjj6-f33q-929c / GHSA-w293-vg96-wgc3
  # advisories. Drop the line once a release of guarded-fetch pins a fixed
  # undici (>= 7.30.1) and Arnold is on it.
  "guarded-fetch>undici": 7.30.1

# Every dependency with a build script, each one a decision: `true` runs it,
# `false` skips it. pnpm 11+ fails the install on a build script missing here.
allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  sharp: true
  supabase: true
  "@mongodb-js/zstd": false
  browser-tabs-lock: false
  core-js: false
  node-liblzma: false
  # Both come with Jest 30 (jest-haste-map and jest-resolve, since the Expo SDK
  # 58 upgrade) and ship their native code as optional per-platform packages
  # the lockfile already pins (@parcel/watcher-* and @unrs/resolver-binding-*),
  # so neither install script has anything to do: @parcel/watcher's only runs
  # node-gyp when npm_config_build_from_source is set, and unrs-resolver's is
  # napi-postinstall's fallback for a package manager that skipped the binding.
  "@parcel/watcher": false
  unrs-resolver: false

# uniwind's Metro resolver swaps `react-native` for its own export list, which
# lacks RN 0.88's AssetRegistry: expo-asset reads it, so fonts never load and
# the splash never hides. Drop the patch once uniwind exports it (FIT-170).
patchedDependencies:
  # Drizzle 0.31.11 drops expressions from later policies during pull. Keep
  # every condition and order policies by name so generated schema is stable.
  drizzle-kit@0.31.11: patches/drizzle-kit@0.31.11.patch
  # eve 1.1.0 put a closure over a loop variable in its stream reader
  # (dist/src/client/open-stream.js), so Babel (Jest's and Metro's Hermes
  # output alike) compiles the loop body into a `yield* _loop()`, in which
  # leaving the read early reconnects instead of ending it: in mobile's tests
  # every send after a Conversation's first hung (FIT-780). The patch only moves
  # the closure out of the loop. 1.4.0 still has it: on a bump, try without the
  # patch first; if mobile's fake-arnold and arnold-screen tests fail, make it
  # again for the new version.
  eve@1.3.0: patches/eve@1.3.0.patch
  uniwind@1.12.2: patches/uniwind@1.12.2.patch

# Advisories accepted for `pnpm audit`, each with its reason. Drop each line
# once it no longer shows up.
auditConfig:
  ignoreGhsas:
    # zod 3.25.76 comes only through apps__mobile > expo > @expo/cli, the dev
    # and build-time CLI, never the app binary (FIT-345). Recheck on every Expo
    # SDK or patch bump. @expo/cli asks for zod ^3.25.76, and there is no fixed
    # 3.x (the fix is zod >= 4.6.6). Forcing zod 4 on the CLI would likely
    # break it. Drop once @expo/cli moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # glob 10 / 13 and their minimatch 9 / 10 (FIT-471): only mobile's build and
    # test tooling asks for them (Expo's @expo/cli, config, metro-config and
    # fingerprint, @sentry/react-native's @sentry/bundler-plugins 10, Jest and
    # its test-exclude), never the app binary or a deployed backend (the
    # backends' @sentry/bundler-plugins 11 is on glob 14). Neither glob's
    # AbortSignal bypass nor minimatch's ReDoS takes outside input there.
    # Recheck on every Expo SDK, Jest or @sentry/react-native bump.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
    # deepmerge 4.3.1 under apps__mobile > @segment/analytics-react-native: no
    # patched release (FIT-364). Segment only deep-merges the device context it
    # builds itself and the traits auth-sync.tsx passes to identify ({ email,
    # name }: our keys, string values), never an object whose keys a User
    # chooses. Recheck on every Segment bump, and whenever identify gets traits.
    - GHSA-gcqx-w48m-w2h4
    # postcss-selector-parser 6.0.10 under apps__site > @tailwindcss/typography
    # (FIT-415): typography 0.5.20, the latest, pins it exactly, so there is no
    # fixed path. A devDependency run only at build time over our own CSS, never
    # a selector from outside. Drop once typography moves to >= 6.1.5.
    - GHSA-rj75-hqrm-r3gf
    # esbuild 0.18.20 under packages__db > drizzle-kit > @esbuild-kit (FIT-415):
    # drizzle-kit 0.31.11, the latest, still pulls it. Its dev server's CORS
    # issue needs `esbuild --serve`, which drizzle-kit never starts: it only
    # loads drizzle.config.ts for schema:generate against the local stack.
    # Drop once drizzle-kit drops @esbuild-kit.
    - GHSA-67mh-4wv8-2f99
