packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo autolinking and Metro expect a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  "@snaplet/seed": true
  core-js: false
  esbuild: true
  sharp: true
  supabase: true

minimumReleaseAgeExclude:
  - lucide-react@1.47.0
