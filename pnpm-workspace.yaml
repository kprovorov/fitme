packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo autolinking and Metro expect a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# One react for the whole workspace: the version React Native in Expo SDK 57
# expects. Without this, auto-installed peers (Clerk, Next in the backend apps)
# resolve the newest react and leave a second copy for expo-doctor to flag.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # One zod 4 for the workspace: @vercel/cli-config (under @vercel/functions)
  # pins an older 4.x exactly. Keep it on the apps' zod version.
  "@vercel/cli-config>zod": 4.6.7

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@sentry/cli"
  - "@snaplet/seed"
  - esbuild
  - sharp
  - supabase

ignoredBuiltDependencies:
  - "@mongodb-js/zstd"
  - browser-tabs-lock
  - core-js
  - node-liblzma
