packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo autolinking and Metro expect a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# One react for the whole workspace: the version React Native in Expo SDK 58
# expects. Without this, auto-installed peers (Clerk, Next in the backend apps)
# resolve the newest react and leave a second copy for expo-doctor to flag.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  # One zod 4 for the workspace: @vercel/cli-config (under @vercel/functions)
  # and ultracite pin other 4.x versions exactly. Keep them on the apps' zod
  # version.
  "@vercel/cli-config>zod": 4.6.7
  "ultracite>zod": 4.6.7
  # zod-to-json-schema (under MCP's @modelcontextprotocol/sdk) takes zod as a
  # peer, which resolved to zod 3: open to GHSA-mrhx-c7xc-m3w5, with no fixed
  # 3.x (FIT-330). Keep it on the apps' zod 4; it reads schemas through
  # `zod/v3`, which zod 4 still ships. A parent that brings its own zod 3
  # (mobile's expo-mcp, @expo/cli) still resolves zod 3: that stays until Expo
  # moves to zod 4. Drop the line once the SDK no longer depends on it.
  "zod-to-json-schema>zod": 4.6.7
  # Arnold's undici (FIT-328): eve pins undici 8.10.2 exactly (still in eve
  # 0.83.2) and guarded-fetch (under just-bash) 7.29.0 / 7.30.0, both open to
  # the GHSA-xjj6-f33q-929c / GHSA-w293-vg96-wgc3 advisories. Drop each line
  # once a release of eve or guarded-fetch pins a fixed undici (>= 8.12.2,
  # >= 7.30.1) and Arnold is on it.
  "eve>undici": 8.12.3
  "guarded-fetch>undici": 7.30.1

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@sentry/cli"
  - esbuild
  - sharp
  - supabase

ignoredBuiltDependencies:
  - "@mongodb-js/zstd"
  - browser-tabs-lock
  - core-js
  - node-liblzma

# uniwind's Metro resolver swaps `react-native` for its own export list, which
# lacks RN 0.88's AssetRegistry: expo-asset reads it, so fonts never load and
# the splash never hides. Drop the patch once uniwind exports it (FIT-170).
patchedDependencies:
  # Drizzle 0.31.11 drops expressions from later policies during pull. Keep
  # every condition and order policies by name so generated schema is stable.
  drizzle-kit@0.31.11: patches/drizzle-kit@0.31.11.patch
  uniwind@1.12.2: patches/uniwind@1.12.2.patch

# Advisories accepted for `pnpm audit`, each with its reason. Drop each line
# once it no longer shows up.
auditConfig:
  ignoreGhsas:
    # The first two come only through apps__mobile > expo > @expo/cli, the dev
    # and build-time CLI, never the app binary (FIT-345). Recheck on every Expo
    # SDK or patch bump.
    # zod 3.25.76: @expo/cli asks for zod ^3.25.76, and there is no fixed 3.x
    # (the fix is zod >= 4.6.6). Forcing zod 4 on the CLI would likely break
    # it. Drop once @expo/cli moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # node-forge 1.4.0: no patched release (accepted in FIT-330). Drop once
    # node-forge ships a fix and @expo/cli is on it.
    - GHSA-86w9-cpqp-85rv
    # deepmerge 4.3.1 under apps__mobile > @segment/analytics-react-native: no
    # patched release (FIT-364). Segment only deep-merges the device context it
    # builds itself and the traits auth-sync.tsx passes to identify ({ email,
    # name }: our keys, string values), never an object whose keys a User
    # chooses. Recheck on every Segment bump, and whenever identify gets traits.
    - GHSA-gcqx-w48m-w2h4
