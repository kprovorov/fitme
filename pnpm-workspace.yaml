packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo autolinking and Metro expect a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# One react for the whole workspace: the version React Native in Expo SDK 58
# expects. Without this, auto-installed peers (Clerk, Next in the backend apps)
# resolve the newest react and leave a second copy for expo-doctor to flag.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  # One zod 4 for the workspace: @vercel/cli-config (under @vercel/functions)
  # and ultracite pin other 4.x versions exactly. Keep them on the apps' zod
  # version.
  "@vercel/cli-config>zod": 4.6.7
  "ultracite>zod": 4.6.7
  # zod-to-json-schema (under MCP's @modelcontextprotocol/sdk) takes zod as a
  # peer, which resolved to zod 3: open to GHSA-mrhx-c7xc-m3w5, with no fixed
  # 3.x (FIT-330). Keep it on the apps' zod 4; it reads schemas through
  # `zod/v3`, which zod 4 still ships.
  "zod-to-json-schema>zod": 4.6.7
  # Arnold's undici (FIT-328): eve pins undici 8.10.2 exactly (still in eve
  # 0.83.2) and guarded-fetch (under just-bash) 7.29.0 / 7.30.0, both open to
  # the GHSA-xjj6-f33q-929c / GHSA-w293-vg96-wgc3 advisories. Drop each line
  # once a release of eve or guarded-fetch pins a fixed undici (>= 8.12.2,
  # >= 7.30.1) and Arnold is on it.
  "eve>undici": 8.12.3
  "guarded-fetch>undici": 7.30.1

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@sentry/cli"
  - esbuild
  - sharp
  - supabase

ignoredBuiltDependencies:
  - "@mongodb-js/zstd"
  - browser-tabs-lock
  - core-js
  - node-liblzma

# uniwind's Metro resolver swaps `react-native` for its own export list, which
# lacks RN 0.88's AssetRegistry: expo-asset reads it, so fonts never load and
# the splash never hides. Drop the patch once uniwind exports it (FIT-170).
patchedDependencies:
  uniwind@1.12.2: patches/uniwind@1.12.2.patch
