# Signs in from the login screen. Needs EMAIL and PASSWORD (runFlow env).
appId: com.fitmeproject.ios
---
# The field as a regex: an email's only special characters are + and .
- evalScript: ${output.emailPattern = EMAIL.split('+').join('\\+').split('.').join('\\.')}

# On a slow simulator the field can drop keystrokes (it once kept only the
# first letter): check it holds the whole address, and type it again if not
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "login-email-input"
      - waitForAnimationToEnd
      - eraseText: 80
      - inputText: ${EMAIL}
      - assertVisible:
          id: "login-email-input"
          text: ${output.emailPattern}

- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- inputText: ${PASSWORD}

- waitForAnimationToEnd

- tapOn:
    id: "login-button"

# A sign-in from a new device also needs an emailed code (Clerk's Device
# Trust). Test mode accepts 424242 for +clerk_test addresses.
- extendedWaitUntil:
    visible:
      text: "Check your email|Workout|Get Started|Not Now"
    timeout: 30000

- runFlow:
    when:
      visible:
        id: "verify-code-input"
    commands:
      - tapOn:
          id: "verify-code-input"
      - inputText: "424242"
      - tapOn:
          id: "verify-code-button"

# iOS may offer to save the password once the form is gone; its sheet hides
# the screen behind it
- extendedWaitUntil:
    visible:
      text: "Workout|Get Started|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

- waitForAnimationToEnd
