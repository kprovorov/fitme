# Signs in from the login screen. Needs EMAIL and PASSWORD (runFlow env).
appId: com.fitmeproject.ios
---
- tapOn:
    id: "login-email-input"
- waitForAnimationToEnd
- inputText: ${EMAIL}

- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- inputText: ${PASSWORD}

- waitForAnimationToEnd

- tapOn:
    id: "login-button"

# A sign-in from a new device also needs an emailed code (Clerk's Device
# Trust). Test mode accepts 424242 for +clerk_test addresses.
- extendedWaitUntil:
    visible:
      text: "Check your email|Home|Get Started|Not Now"
    timeout: 30000

- runFlow:
    when:
      visible:
        id: "login-code-input"
    commands:
      - tapOn:
          id: "login-code-input"
      - inputText: "424242"
      - tapOn:
          id: "login-code-button"

# iOS may offer to save the password once the form is gone; its sheet hides
# the screen behind it
- extendedWaitUntil:
    visible:
      text: "Home|Get Started|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

- waitForAnimationToEnd
