# Dismisses iOS's "Save Password?" sheet if it's up. Ad hoc signed builds get
# it, and it can land late (on the code screen, after the first one was
# dismissed), covering the button the next tap is for.
appId: com.fitmeproject.ios
---
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd
