# Registers a new User from the register screen and enters the emailed code.
# Needs NAME, EMAIL (a +clerk_test address, so Clerk's test mode accepts the
# fixed code 424242 and sends no email) and PASSWORD (runFlow env).
appId: com.fitmeproject.ios
---
- tapOn:
    id: "name-input"
- waitForAnimationToEnd
- inputText: ${NAME}

- tapOn:
    id: "email-input"
- waitForAnimationToEnd
- inputText: ${EMAIL}

- tapOn:
    id: "password-input"
- waitForAnimationToEnd
- inputText: ${PASSWORD}

- tapOn:
    id: "register-button"

# iOS may offer to save the password as the form submits
- tapOn:
    text: "Not Now"
    optional: true

- extendedWaitUntil:
    visible:
      id: "verify-code-input"
    timeout: 15000

- tapOn:
    id: "verify-code-input"
- inputText: "424242"
- tapOn:
    id: "verify-code-button"

- waitForAnimationToEnd
