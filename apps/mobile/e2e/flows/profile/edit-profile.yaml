appId: com.fitmeproject.ios
---
# A fresh +clerk_test User per run (see the auth flow)
- evalScript: ${output.email = 'e2e-profile-' + Date.now() + '-' + Math.floor(Math.random() * 1e6) + '+clerk_test@fitmeproject.com'}

- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# ===== REGISTER =====
- runFlow:
    file: ../../subflows/register.yaml
    env:
      NAME: "Tony Stark"
      EMAIL: ${output.email}
      PASSWORD: "fitme-e2e-kettlebell-swing"

# Lands on onboarding — iOS may offer to save the password first
- extendedWaitUntil:
    visible:
      text: "Get Started|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

# Skip onboarding, so the user has no profile yet
- assertVisible:
    text: "Get Started"

- tapOn:
    text: "Skip"

- waitForAnimationToEnd

# ===== EDIT PROFILE =====
# Profile is the first tab's header button (its spoken label), not a tab
- tapOn:
    text: "Profile"

- waitForAnimationToEnd

- tapOn:
    id: "edit-profile-link"

- waitForAnimationToEnd

- assertVisible:
    text: "Edit Profile"

# The E2E User persists between runs, so a fresh name proves the save
# reached Clerk rather than matching a name left by an earlier run.
- evalScript: ${output.newName = 'Pepper ' + Date.now()}

- tapOn:
    id: "edit-profile-name-input"
- eraseText: 50
- inputText: ${output.newName}

- tapOn:
    text: "Female"

# Each row opens a wheel at the bottom; scroll it to set a value
- tapOn:
    text: "Age.*"
- waitForAnimationToEnd
- swipe:
    start: "50%,87%"
    end: "50%,80%"
    duration: 600
- waitForAnimationToEnd

- tapOn:
    text: "Weight.*"
- waitForAnimationToEnd
- swipe:
    start: "50%,80%"
    end: "50%,87%"
    duration: 600
- waitForAnimationToEnd

- tapOn:
    text: "Height.*"
- waitForAnimationToEnd
- swipe:
    start: "50%,80%"
    end: "50%,87%"
    duration: 600
- waitForAnimationToEnd

- assertNotVisible:
    text: ".*Not Set"

- tapOn:
    id: "edit-profile-save-button"

- waitForAnimationToEnd

# Back on the Profile screen with the new name
- assertVisible:
    id: "edit-profile-link"
- assertVisible:
    text: ${output.newName}

# Edit-profile pre-fills the saved name from Clerk
- tapOn:
    id: "edit-profile-link"
- waitForAnimationToEnd
- assertVisible:
    id: "edit-profile-name-input"
    text: ${output.newName}
