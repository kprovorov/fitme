appId: com.fitmeproject.ios
---
# A fresh +clerk_test User per run (see the auth flow)
- evalScript: ${output.email = 'e2e-profile-' + Date.now() + '-' + Math.floor(Math.random() * 1e6) + '+clerk_test@fitmeproject.com'}

- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# ===== REGISTER =====
- runFlow:
    file: ../../subflows/register.yaml
    env:
      NAME: "Tony Stark"
      EMAIL: ${output.email}
      PASSWORD: "fitme-e2e-kettlebell-swing"

# Lands on onboarding — iOS may offer to save the password first
- extendedWaitUntil:
    visible:
      text: "Get Started|Not Now"
    timeout: 15000

- tapOn:
    text: "Not Now"
    optional: true

# Skip onboarding, so the user has no profile yet
- assertVisible:
    text: "Get Started"

- tapOn:
    text: "Skip"

- waitForAnimationToEnd

# ===== EDIT PROFILE =====
- tapOn:
    text: "Profile"

- waitForAnimationToEnd

- tapOn:
    id: "edit-profile-link"

- waitForAnimationToEnd

- assertVisible:
    text: "Edit Profile"

- tapOn:
    id: "edit-profile-name-input"
- eraseText: 20
- inputText: "Virginia Potts"

- tapOn:
    text: "Female"

# Each row opens a wheel at the bottom; scroll it to set a value
- tapOn:
    text: "Age.*"
- waitForAnimationToEnd
- swipe:
    start: "50%,87%"
    end: "50%,80%"
    duration: 600
- waitForAnimationToEnd

- tapOn:
    text: "Weight.*"
- waitForAnimationToEnd
- swipe:
    start: "50%,80%"
    end: "50%,87%"
    duration: 600
- waitForAnimationToEnd

- tapOn:
    text: "Height.*"
- waitForAnimationToEnd
- swipe:
    start: "50%,80%"
    end: "50%,87%"
    duration: 600
- waitForAnimationToEnd

- assertNotVisible:
    text: ".*Not Set"

- tapOn:
    id: "edit-profile-save-button"

- waitForAnimationToEnd

# Back on the Profile tab with the new name
- assertVisible:
    id: "edit-profile-link"
- assertVisible:
    text: "Virginia Potts"
