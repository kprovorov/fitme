appId: com.fitmeproject.ios
env:
  NAME: "Tony Stark"
  # At least Clerk's minimum length (15) and not a known breached password
  PASSWORD: "fitme-e2e-kettlebell-swing"
  NEW_PASSWORD: "fitme-e2e-turkish-get-up"
---
# A fresh +clerk_test User per run: Clerk's test mode sends no email and
# accepts the fixed code 424242, for the reset code too.
- evalScript: ${output.email = 'e2e-reset-' + Date.now() + '-' + Math.floor(Math.random() * 1e6) + '+clerk_test@fitmeproject.com'}

- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# ===== REGISTER =====
- runFlow:
    file: ../../subflows/register.yaml
    env:
      NAME: ${NAME}
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}

- extendedWaitUntil:
    visible:
      text: "Get Started|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Skip"

- waitForAnimationToEnd

# ===== LOGOUT =====
- tapOn:
    text: "Profile"

- waitForAnimationToEnd

- tapOn:
    id: "logout-button"

- waitForAnimationToEnd

- tapOn:
    id: "login-here-link"

- waitForAnimationToEnd

# ===== REQUEST A RESET CODE =====
- tapOn:
    id: "forgot-password-link"

- waitForAnimationToEnd

- tapOn:
    id: "forgot-password-email-input"
- waitForAnimationToEnd
- inputText: ${output.email}

- tapOn:
    id: "forgot-password-button"

- extendedWaitUntil:
    visible:
      id: "verify-code-input"
    timeout: 30000

# ===== WRONG CODE, THEN THE RIGHT ONE =====
- tapOn:
    id: "verify-code-input"
- inputText: "000000"
- tapOn:
    id: "verify-code-button"

- extendedWaitUntil:
    visible:
      id: "verify-code-error"
    timeout: 10000

- tapOn:
    id: "verify-code-input"
- eraseText: 10
- inputText: "424242"
- tapOn:
    id: "verify-code-button"

- extendedWaitUntil:
    visible:
      id: "reset-password-input"
    timeout: 30000

# ===== NEW PASSWORD TOO SHORT =====
- tapOn:
    id: "reset-password-input"
- inputText: "too-short"
- tapOn:
    id: "reset-password-confirm-input"
- inputText: "too-short"
- tapOn:
    id: "reset-password-button"

- assertVisible:
    text: "Password must be at least 15 characters."

# ===== NEW PASSWORD =====
- tapOn:
    id: "reset-password-input"
- eraseText: 20
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "reset-password-confirm-input"
- eraseText: 20
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "reset-password-button"

# Signed in on Home (the User skipped onboarding); iOS may offer to save the
# password first
- extendedWaitUntil:
    visible:
      text: "Home|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

- assertVisible:
    text: "Home"
    enabled: true

# ===== THE OLD PASSWORD NO LONGER WORKS =====
- tapOn:
    text: "Profile"

- waitForAnimationToEnd

- tapOn:
    id: "logout-button"

- waitForAnimationToEnd

- tapOn:
    id: "login-here-link"

- waitForAnimationToEnd

- tapOn:
    id: "login-email-input"
- waitForAnimationToEnd
- inputText: ${output.email}

- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- inputText: ${PASSWORD}

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      text: "Password is incorrect.*"
    timeout: 10000

# ===== THE NEW ONE DOES =====
# A restart clears the login form; the User is still signed out
- stopApp
- launchApp

- waitForAnimationToEnd

- tapOn:
    id: "login-here-link"

- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${NEW_PASSWORD}

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

- assertVisible:
    text: "Home"
    enabled: true
