appId: com.fitmeproject.ios
env:
  NAME: "Tony Stark"
  # At least Clerk's minimum length (15) and not a known breached password
  PASSWORD: "fitme-e2e-kettlebell-swing"
---
# A fresh +clerk_test User per run: Clerk's test mode sends no email and
# accepts the fixed code 424242.
- evalScript: ${output.email = 'e2e-auth-' + Date.now() + '-' + Math.floor(Math.random() * 1e6) + '+clerk_test@fitmeproject.com'}

# Clerk keeps its client token in the keychain, which clearState leaves alone
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Signed out, the protected Home tab redirects to the register screen
- assertVisible:
    text: "Welcome to Fitme!"

# ===== PASSWORD TOO SHORT =====
- tapOn:
    id: "name-input"
- waitForAnimationToEnd
- inputText: ${NAME}

- tapOn:
    id: "email-input"
- waitForAnimationToEnd
- inputText: ${output.email}

- tapOn:
    id: "password-input"
- waitForAnimationToEnd
- inputText: "too-short"

- tapOn:
    id: "register-button"

- assertVisible:
    text: "Password must be at least 15 characters."

# ===== REGISTER =====
- tapOn:
    id: "password-input"
- eraseText: 20
- inputText: ${PASSWORD}

- tapOn:
    id: "register-button"

# iOS may offer to save the password as the form submits, and its sheet can
# land after the code screen shows: wait for either, then dismiss the sheet
- extendedWaitUntil:
    visible:
      text: "Check your email|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

- extendedWaitUntil:
    visible:
      id: "verify-code-input"
    timeout: 30000

# ===== WRONG CODE, THEN A NEW ONE =====
- tapOn:
    id: "verify-code-input"
- inputText: "000000"
- tapOn:
    id: "verify-code-button"

- extendedWaitUntil:
    visible:
      id: "verify-code-error"
    timeout: 10000

- tapOn:
    id: "verify-code-resend-button"

- extendedWaitUntil:
    visible:
      text: "We sent you a new code."
    timeout: 10000

- tapOn:
    id: "verify-code-input"
- eraseText: 10
- inputText: "424242"
- tapOn:
    id: "verify-code-button"

# Lands on onboarding (no Profile yet), iOS may offer to save the password
# first. Skip to Home.
- extendedWaitUntil:
    visible:
      text: "Get Started|Not Now"
    timeout: 30000

- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Skip"

- waitForAnimationToEnd

- assertVisible:
    text: "Home"
    enabled: true

# ===== SESSION SURVIVES A RESTART =====
- stopApp
- launchApp

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

- assertNotVisible:
    text: "Welcome to Fitme!"

# ===== LOGOUT =====
- tapOn:
    text: "Profile"

- waitForAnimationToEnd

- tapOn:
    id: "logout-button"

- waitForAnimationToEnd

- assertVisible:
    text: "Welcome to Fitme!"

# ===== WRONG PASSWORD =====
- tapOn:
    id: "login-here-link"

- waitForAnimationToEnd

- tapOn:
    id: "login-email-input"
- waitForAnimationToEnd
- inputText: ${output.email}

- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- inputText: "not-the-right-password"

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      text: "Password is incorrect.*"
    timeout: 10000

# ===== LOGIN AGAIN =====
# A restart clears the login form; the User is still signed out
- stopApp
- launchApp

- waitForAnimationToEnd

- tapOn:
    id: "login-here-link"

- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

- assertVisible:
    text: "Home"
    enabled: true
