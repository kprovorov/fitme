appId: com.fitmeproject.ios
---
- launchApp:
    clearState: true

- waitForAnimationToEnd

- runFlow: "../../subflows/login-as-test-user.yaml"
- runFlow: "../../subflows/wait-for-home.yaml"

# Tap into the first workout
- tapOn:
    text: "E2E Workout A"

- waitForAnimationToEnd

# Start the session
- tapOn:
    text: "Start Workout"

- waitForAnimationToEnd

# Log first set (set index 1)
- tapOn:
    id: "set-reps-input-1"
- eraseText: 50
- inputText: "10"

- tapOn:
    id: "log-set-button-1"

- waitForAnimationToEnd

# Finish the workout
- tapOn:
    id: "finish-workout-button"

- waitForAnimationToEnd

# Should show completion time
- assertVisible:
    text: "Workout finished"
