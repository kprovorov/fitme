appId: com.fitmeproject.ios
---
- launchApp:
    clearState: true

- waitForAnimationToEnd

- runFlow: "../../subflows/login-as-test-user.yaml"
- waitForAnimationToEnd

# Should be on Welcome onboarding screen or Home if already onboarded
# Tap Get Started if on welcome screen
- runScript:
    file: "../../scripts/noop.js"

- tapOn:
    text: "Get Started"
    optional: true

- waitForAnimationToEnd

# Fill profile
- assertVisible:
    text: "Let's get to know you!"

# Select gender (Male)
- tapOn:
    text: "Male"

# Open Age wheel
- tapOn:
    text: "Age"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 300
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Open Weight wheel
- tapOn:
    text: "Weight"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 300
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Open Height wheel
- tapOn:
    text: "Height"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 300
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Tap Next
- tapOn:
    text: "Next"

- waitForAnimationToEnd

# Should navigate to planner
- assertVisible:
    text: "Create workout plan"
