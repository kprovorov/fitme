appId: com.fitmeproject.ios
---
- launchApp:
    clearState: true

- waitForAnimationToEnd

- runFlow: "../../subflows/login-as-test-user.yaml"
- runFlow: "../../subflows/wait-for-home.yaml"

# Verify active plan workouts are visible
- assertVisible:
    text: "E2E Workout A"

# Pull to refresh
- scroll:
    direction: DOWN
    speed: 40
    startY: 20%
    endY: 80%

- waitForAnimationToEnd

# Workouts still visible after refresh
- assertVisible:
    text: "E2E Workout A"
