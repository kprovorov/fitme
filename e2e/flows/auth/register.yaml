appId: com.fitmeproject.ios
---
- launchApp:
    clearState: true

- waitForAnimationToEnd

# Should land on register screen
- assertVisible:
    text: "Welcome to Fitme!"

- tapOn:
    id: "name-input"
- inputText: "E2E Register User"

- tapOn:
    id: "email-input"
- inputText: "e2e-register@fitme.test"

- tapOn:
    id: "password-input"
- inputText: "E2eTestP@ss1"

- tapOn:
    id: "register-button"

- waitForAnimationToEnd

# Should land on onboarding welcome screen after registration
- extendedWaitUntil:
    visible:
      text: "Get Started"
    timeout: 10000
