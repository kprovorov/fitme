appId: com.fitmeproject.ios
---
- launchApp:
    clearState: true

- waitForAnimationToEnd

- runFlow: "../../subflows/login-as-test-user.yaml"
- runFlow: "../../subflows/wait-for-home.yaml"

# Navigate to planner (from home screen "Create your first workout plan" or via profile onboarding)
- tapOn:
    text: "Start your workout plan"
    optional: true

# If already have plan, navigate via onboarding/profile link
- tapOn:
    text: "Get Started"
    optional: true

- waitForAnimationToEnd

# Fill profile if on onboarding screen
- tapOn:
    text: "Next"
    optional: true

- waitForAnimationToEnd

# Should be on planner form
- assertVisible:
    text: "Create workout plan"

# Select goal: Lose weight
- tapOn:
    text: "Lose weight"

# Select experience: Beginner
- tapOn:
    text: "Beginner"

# Select frequency: 3
- tapOn:
    text: "3"

# Tap Get my plan
- tapOn:
    text: "Get my plan!"

- waitForAnimationToEnd

# Wait for fixture plan to load (should be fast with x-e2e header)
- assertVisible:
    text: "E2E Test Plan"
    timeout: 15000

# Save the plan
- tapOn:
    id: "save-plan-button"

- waitForAnimationToEnd

# Should be back on Home showing the new plan
- runFlow: "../../subflows/wait-for-home.yaml"
- assertVisible:
    text: "E2E Test Plan"
