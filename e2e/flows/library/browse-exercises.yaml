appId: com.fitmeproject.ios
---
- launchApp:
    clearState: true

- waitForAnimationToEnd

- runFlow: "../../subflows/login-as-test-user.yaml"
- runFlow: "../../subflows/wait-for-home.yaml"

# Navigate to Library tab
- tapOn:
    text: "Library"

- waitForAnimationToEnd

# Verify library content loaded
- assertVisible:
    text: "All"

# Scroll through exercise list
- swipe:
    direction: UP
    duration: 500

- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500

- waitForAnimationToEnd

# Filter by a muscle group
- tapOn:
    text: "Chest"

- waitForAnimationToEnd
