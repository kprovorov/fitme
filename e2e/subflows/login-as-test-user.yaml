appId: com.fitmeproject.ios
---
# Navigate to login screen (from register screen)
- tapOn:
    id: "login-here-link"
- waitForAnimationToEnd

# Fill in credentials
- tapOn:
    id: "email-input"
- waitForAnimationToEnd
- inputText: "tony@stark.com"

- tapOn:
    id: "password-input"
- waitForAnimationToEnd
- inputText: "secret"

- tapOn:
    id: "login-button"
